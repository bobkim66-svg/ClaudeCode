name: gemini-council

on:
  push:
    branches: [main, "claude/**"]
    paths: ["gemini_council/**", ".github/workflows/gemini-council.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # 주 사용 환경
            python: "3.12"
          - os: ubuntu-22.04     # 연구실 노트북과 같은 OS / 기본 Python 3.10
            python: "3.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gemini_council
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존성 + pytest
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q -rs

      - name: 실제 Gemini CLI 설치
        run: npm install -g @google/gemini-cli@0.68.0

      # 로그인이 없는 CI 에서는 '로그인 필요'로 exit 1 이 나와야 정상 (실제 gemini.cmd 경유 호출 검증)
      - name: 실제 CLI 호출 경로 확인 (Windows, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $out = python run_council.py --backend gemini-cli --check 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1 -or $out -notmatch "로그인이 필요함") { throw "예상과 다름 (exit $code)" }
          $global:LASTEXITCODE = 0

      - name: 실제 CLI 호출 경로 확인 (Ubuntu, bash)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          out=$(python run_council.py --backend gemini-cli --check 2>&1); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && grep -q "로그인이 필요함" <<< "$out"

  build-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 실제 Gemini CLI 설치
        run: npm install -g @google/gemini-cli@0.68.0
      - name: exe 빌드 + 단독 실행 점검
        shell: pwsh
        run: ./gemini_council/build.ps1 -SkipTests
      - name: exe 업로드
        uses: actions/upload-artifact@v4
        with:
          name: gemini-council-windows-exe
          path: gemini_council/dist/gemini_council.exe
          if-no-files-found: error
          retention-days: 30
